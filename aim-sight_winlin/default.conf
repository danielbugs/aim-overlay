# Aim sight settings. Opacity ranges from 0.1 (faint) to 1.0 (solid).
# Available profiles/styles: classic, t, dot, 4dots, plus, diamond, circle.
#
# Profiles are stored as separate files in ~/.config/aim-sight/profiles/.
# Create the built-in style profiles with:
#   ./aim-sight.sh --style classic save-profile --profile classic
#   ./aim-sight.sh --style t save-profile --profile t
#   ./aim-sight.sh --style dot save-profile --profile dot
#   ./aim-sight.sh --style 4dots save-profile --profile 4dots
#   ./aim-sight.sh --style plus save-profile --profile plus
#   ./aim-sight.sh --style diamond save-profile --profile diamond
#   ./aim-sight.sh --style circle save-profile --profile circle
#
# Activate one with: ./aim-sight.sh --profile diamond restart
# Leave LAST_PROFILE empty to use these default.conf values.
# Set LAST_PROFILE to a saved profile name to load that profile automatically.
LAST_PROFILE=
STYLE=t
COLOR=white
SIZE=7.0
GAP=2.0
THICKNESS=0.7
OPACITY=0.9
OUTLINE=yes
OUTLINE_THICKNESS=0.6
ANTIALIAS=yes
DOT=no
# Dot radius in pixels.
DOT_SIZE=1.0
# For the 4dots style, the center-to-dot spacing is SIZE + GAP.
# Manual placement correction in pixels. Positive X moves right; positive Y moves down.
OFFSET_X=1.0
OFFSET_Y=1.0
# Colors used by the tray's Cycle color action.
COLOR_CYCLE=red,green,blue,white,yellow
